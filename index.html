<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrapyard: Random Defense</title>
<style>
/* Layout: one reading column, a wordmark rail on top, the short version as the only panel. */
:root {
  --bg: #0f1214; --panel: #1b1e23; --line: #3a3f47; --fg: #d3d8dd; --dim: #8a929b;
  --rust: #d4672e; --oxide: #3cbfa9;
  --display: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef0f2; --panel: #ffffff; --line: #cdd2d8; --fg: #1b2026; --dim: #58616b;
  --rust: #a8461a; --oxide: #0f7a6b; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #eef0f2; --panel: #ffffff; --line: #cdd2d8; --fg: #1b2026; --dim: #58616b;
  --rust: #a8461a; --oxide: #0f7a6b; color-scheme: light; }
body { background: var(--bg); color: var(--fg); font: 16px/1.62 var(--body); }
.wrap { max-width: 44rem; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; }
.mark { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
  font-family: var(--display); font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.mark b { color: var(--fg); font-size: 1.05rem; }
.mark span { color: var(--rust); font-size: .8rem; }
h1 { font: 700 clamp(1.7rem, 5vw, 2.3rem)/1.15 var(--display); margin: 28px 0 6px; text-wrap: balance; }
.stamp { font: 500 .78rem/1.4 var(--display); color: var(--dim); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 28px; }
h2 { font: 700 .82rem/1.3 var(--display); letter-spacing: .12em; text-transform: uppercase;
  color: var(--rust); margin: 40px 0 10px; }
h3 { font: 600 1.05rem/1.35 var(--body); margin: 28px 0 6px; text-wrap: balance; }
p, ul { margin: 0 0 14px; }
ul { padding-left: 1.2em; display: grid; gap: 8px; }
strong { font-weight: 600; }
a { color: var(--oxide); text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--oxide); outline-offset: 2px; border-radius: 2px; }
code { font: .88em var(--display); background: var(--panel); border: 1px solid var(--line);
  padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.short { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
.short p:last-child { margin: 0; }
.table { overflow-x: auto; margin: 6px 0 14px; }
table { border-collapse: collapse; width: 100%; font-size: .94rem; }
th { font: 600 .74rem/1.3 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); text-align: left; }
th, td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td:first-child { white-space: nowrap; }
.contact { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.addr { font: 600 1rem var(--display); }
.pending { font: 600 .8rem var(--display); color: var(--rust); border: 1px dashed var(--rust); border-radius: 6px; padding: 4px 8px; }
dl { margin: 0; display: grid; gap: 18px; }
dt { font-weight: 600; margin-bottom: 4px; }
dd { margin: 0; }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--dim);
  font: .8rem/1.5 var(--display); display: flex; flex-wrap: wrap; gap: 6px 18px; }

</style>
</head>
<body>
<main class="wrap">
<div class="mark"><b>Scrapyard</b><span>Random Defense</span></div>

<h1>Scrapyard: Random Defense</h1>
<p class="stamp">iPhone</p>
<p><a href="support.html">Support</a></p>
<p><a href="privacy.html">Privacy Policy</a></p>

<footer><span>Scrapyard: Random Defense · iPhone</span><span>No account. No server. Progress stays on your device.</span></footer>
</main>
</body>
</html>
